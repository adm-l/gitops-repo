apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-api
  template:
    metadata:
      labels:
        app: hello-api
    spec:
      containers:
        - name: hello-api
          image: bharat777/hello-api:latest
          ports:
            - containerPort: 3000
